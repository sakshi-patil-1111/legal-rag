[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-rag-project"
version = "0.1.0"
description = "Modular experimental framework for legal case analysis and decision support."
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Student Researcher"}]
keywords = ["legal", "rag", "retrieval", "nlp"]

[project.optional-dependencies]
nn = ["sentence-transformers>=2.2.0"]
retrieval = ["scikit-learn>=1.3.0", "numpy>=1.24.0"]
external = ["openai>=1.0.0", "anthropic>=0.20.0"]
dev = ["pytest>=7.0.0", "black>=23.0.0", "ruff>=0.1.0", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
